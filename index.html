<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্কুল শিক্ষক প্যানেল - মোবাইল সংস্করণ</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .mobile-container {
            width: 100%;
            max-width: 380px;
            height: 680px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 1px solid #e2e8f0;
        }
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            padding: 15px;
            overflow-y: auto;
        }
        .screen.active {
            display: flex;
        }
        /* Header */
        .top-bar {
            background-color: #0f172a;
            color: #ffffff;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: -15px -15px 15px -15px;
        }
        .top-bar button {
            background: transparent;
            border: none;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        /* Form controls */
        label {
            font-size: 12px;
            font-weight: bold;
            color: #334155;
            margin-top: 8px;
            margin-bottom: 3px;
            display: block;
        }
        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background-color: #f8fafc;
            font-size: 13px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #0f172a;
        }
        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-dark { background-color: #0f172a; color: white; }
        .btn-dark:hover { background-color: #334155; }
        .btn-success { background-color: #10b981; color: white; }
        .btn-success:hover { background-color: #059669; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-danger:hover { background-color: #dc2626; }
        
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }
        .btn-group .btn {
            flex: 1;
        }
        /* Tables */
        .preview-box {
            flex: 1;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #f8fafc;
            overflow-y: auto;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }
        th {
            background-color: #334155;
            color: white;
            padding: 6px;
            text-align: left;
            position: sticky;
            top: 0;
        }
        td {
            padding: 6px;
            border-bottom: 1px solid #e2e8f0;
            background: white;
        }
        .text-center { text-align: center; }
        .entry-input {
            width: 45px;
            text-align: center;
            padding: 3px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }
        /* Modal Progress */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 85%;
            text-align: center;
        }
        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e2e8f0;
            border-radius: 6px;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #10b981;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="screen active" style="justify-content: center;">
        <div style="text-align: center; margin-bottom: 20px;">
            <h2 id="login-school-name" style="font-size: 18px; color: #1e293b;">আমার বিদ্যালয়</h2>
            <p style="font-size: 14px; font-weight: bold; color: #475569;">স্কুল শিক্ষক প্যানেল</p>
            <p style="font-size: 12px; color: #64748b;">আপনার অ্যাকাউন্টে লগইন করুন</p>
        </div>

        <div>
            <label>ইউজারনেম</label>
            <input type="text" id="username" placeholder="admin">

            <label>পাসওয়ার্ড</label>
            <input type="password" id="password" placeholder="1234">

            <button class="btn btn-dark" onclick="handleLogin()">লগইন করুন</button>
        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboard-screen" class="screen">
        <div style="text-align: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px;">
            <h3 style="font-size: 15px; color: #1e293b;">মার্কস ড্যাশবোর্ড প্যানেল</h3>
            <p id="teacher-info" style="font-size: 11px; font-weight: bold; color: #475569; margin-top: 2px;"></p>
        </div>

        <div style="margin-top: 5px;">
            <label>পরীক্ষার নাম:</label>
            <select id="exam-select" onchange="loadSavedMarksPreview()"></select>

            <label>বরাদ্দকৃত বিষয়:</label>
            <select id="subject-select" onchange="updateSections()"></select>

            <label>শাখা (Section):</label>
            <select id="section-select" onchange="loadSavedMarksPreview()"></select>
        </div>

        <div class="btn-group">
            <button class="btn btn-dark" onclick="openStudentMarksEntry()">মার্কস এন্ট্রি করুন</button>
            <button class="btn btn-success" onclick="syncDashboardDataToCloud()">ফলাফল সেন্ড ☁</button>
        </div>

        <label style="margin-top: 10px;">সংরক্ষিত নম্বরের তালিকা:</label>
        <div class="preview-box">
            <table>
                <thead>
                    <tr>
                        <th style="width: 45px;">রোল</th>
                        <th>শিক্ষার্থীর নাম</th>
                        <th style="width: 75px;" class="text-center">প্রাপ্ত নম্বর</th>
                    </tr>
                </thead>
                <tbody id="preview-table-body">
                </tbody>
            </table>
        </div>

        <button class="btn btn-danger" style="margin-top: 10px; padding: 6px;" onclick="showScreen('login-screen')">লগআউট</button>
    </div>

    <!-- MARKS ENTRY SCREEN -->
    <div id="entry-screen" class="screen">
        <div class="top-bar">
            <button onclick="showScreen('dashboard-screen')">‹ ড্যাশবোর্ডে ফিরে যান</button>
            <span style="font-size: 12px; font-weight: bold;">মার্কস এন্ট্রি প্যানেল</span>
        </div>

        <div id="entry-sub-header" style="text-align: center; font-size: 11px; font-weight: bold; color: #475569; margin-bottom: 8px;"></div>

        <div class="preview-box">
            <table>
                <thead>
                    <tr id="entry-table-header">
                        <th style="width: 35px;">রোল</th>
                        <th>শিক্ষার্থীর নাম</th>
                        <th class="text-center" id="col-cq">CQ</th>
                        <th class="text-center" id="col-mcq">MCQ</th>
                        <th class="text-center" id="col-prac">PRAC</th>
                        <th class="text-center" id="col-single" style="display:none;">প্রাপ্ত নম্বর</th>
                        <th class="text-center" style="width: 40px;">Abs</th>
                    </tr>
                </thead>
                <tbody id="entry-table-body">
                </tbody>
            </table>
        </div>

        <div class="btn-group">
            <button class="btn btn-success" onclick="saveMarksAction()">নম্বর সংরক্ষণ করুন</button>
            <button class="btn btn-danger" onclick="deleteMarksAction()">নম্বর মুছুন</button>
        </div>
    </div>

    <!-- PROGRESS MODAL -->
    <div id="progress-modal" class="modal-overlay">
        <div class="modal-card">
            <p style="font-size: 13px; font-weight: bold; color: #1e293b;" id="progress-title">গুগল শিটে দ্রুত ডেটা পাঠানো হচ্ছে...</p>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <p id="progress-text" style="font-size: 12px; color: #64748b;">প্রসেস করা হচ্ছে...</p>
        </div>
    </div>
</div>

<script>
    // --- Local Storage Initialization ---
    function initDatabase() {
        if (!localStorage.getItem("school_settings")) {
            localStorage.setItem("school_settings", JSON.stringify({ school_name: "আমার বিদ্যালয়" }));
        }
        if (!localStorage.getItem("teachers")) {
            localStorage.setItem("teachers", JSON.stringify([
                { username: "admin", password: "1234", name: "সুনীল কান্তি দে", id: "0", designation: "প্রধান শিক্ষক" }
            ]));
        }
        if (!localStorage.getItem("teacher_assignments")) {
            localStorage.setItem("teacher_assignments", JSON.stringify([
                { teacher_id: "0", exam_type: "বার্ষিক পরীক্ষা", class_name: "10", subject_name: "বাংলা ১ম পত্র", subject_code: "101", section_name: "A" }
            ]));
        }
        if (!localStorage.getItem("students")) {
            localStorage.setItem("students", JSON.stringify([
                { roll: "1", name: "রহিম আহমেদ", section: "A", class_name: "10", religion: "ইসলাম", department: "বিজ্ঞান" },
                { roll: "2", name: "করিম উল্লাহ", section: "A", class_name: "10", religion: "ইসলাম", department: "বিজ্ঞান" },
                { roll: "3", name: "সুমিত দাশ", section: "A", class_name: "10", religion: "হিন্দু", department: "বিজ্ঞান" }
            ]));
        }
        if (!localStorage.getItem("subject_marks_config")) {
            localStorage.setItem("subject_marks_config", JSON.stringify([
                { class_name: "10", subject_code: "101", written_marks: 70, mcq_marks: 30, practical_marks: 0 }
            ]));
        }
        if (!localStorage.getItem("marks_store")) {
            localStorage.setItem("marks_store", JSON.stringify([]));
        }
    }

    initDatabase();

    let loggedInTeacher = { name: "", username: "", id: "", designation: "" };
    
    // আপনার তৈরি করা গুগল অ্যাপস স্ক্রিপ্টের Web App URL
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxDwLwPVv6i-6JvSe7ueJEWdKkURm6zg7gQCGuYmxPdaJ6KGHVcbXdRqc4fIXbXhwiZYA/exec";

    // --- Screen Navigation ---
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // --- Authentication ---
    function handleLogin() {
        const u = document.getElementById("username").value.trim();
        const p = document.getElementById("password").value.trim();

        if (!u || !p) {
            alert("দয়া করে ইউজারনেম এবং পাসওয়ার্ড দিন!");
            return;
        }

        const teachers = JSON.parse(localStorage.getItem("teachers") || "[]");
        const found = teachers.find(t => (t.username === u || t.id === u) && t.password === p);

        if (found) {
            loggedInTeacher = found;
            createDashboard();
        } else if (u === "admin" && p === "1234") {
            loggedInTeacher = { name: "সুনীল কান্তি দে", id: "0", designation: "প্রধান শিক্ষক", username: "admin" };
            createDashboard();
        } else {
            alert("ভুল ইউজারনেম বা পাসওয়ার্ড!");
        }
    }

    // --- Dashboard logic ---
    function createDashboard() {
        const settings = JSON.parse(localStorage.getItem("school_settings") || "{}");
        document.getElementById("login-school-name").innerText = settings.school_name || "আমার বিদ্যালয়";
        
        let desigText = loggedInTeacher.designation ? ` (${loggedInTeacher.designation})` : '';
        document.getElementById("teacher-info").innerText = `শিক্ষক: ${loggedInTeacher.name}${desigText}`;

        loadTeacherAssignments();
        showScreen("dashboard-screen");
    }

    function loadTeacherAssignments() {
        const assignments = JSON.parse(localStorage.getItem("teacher_assignments") || "[]");
        
        // ফিল্টার: অ্যাডমিন হলে সব দেখাবে, অন্যথায় শুধু শিক্ষকের নিজস্ব অ্যাসাইনমেন্ট
        const filteredAssignments = (loggedInTeacher.id === "0" || !loggedInTeacher.id) 
            ? assignments 
            : assignments.filter(a => String(a.teacher_id) === String(loggedInTeacher.id));

        const exams = [...new Set(filteredAssignments.map(a => a.exam_type))];
        const subjects = [...new Set(filteredAssignments.map(a => `ক্লাস: ${a.class_name} | বিষয়: ${a.subject_name} — কোড: ${a.subject_code}`))];

        const examSelect = document.getElementById("exam-select");
        examSelect.innerHTML = (exams.length ? exams : ["বার্ষিক পরীক্ষা"]).map(e => `<option value="${e}">${e}</option>`).join("");

        const subSelect = document.getElementById("subject-select");
        subSelect.innerHTML = (subjects.length ? subjects : ["বরাদ্দকৃত কোনো বিষয় পাওয়া যায়নি"]).map(s => `<option value="${s}">${s}</option>`).join("");

        updateSections();
    }

    function updateSections() {
        const selectedSub = document.getElementById("subject-select").value;
        let targetClass = "";
        if (selectedSub.includes("|")) {
            targetClass = selectedSub.split("|")[0].replace("ক্লাস:", "").trim();
        }

        const assignments = JSON.parse(localStorage.getItem("teacher_assignments") || "[]");
        const sections = [...new Set(assignments.filter(a => a.class_name === targetClass).map(a => a.section_name))];

        const secSelect = document.getElementById("section-select");
        secSelect.innerHTML = (sections.length ? sections : ["A"]).map(s => `<option value="${s}">${s}</option>`).join("");

        loadSavedMarksPreview();
    }

    function parseSubjectString(str) {
        let cleanSubject = str.trim();
        let targetClass = "";
        let targetCode = "";

        if (str.includes("|")) {
            const parts = str.split("|");
            targetClass = parts[0].replace("ক্লাস:", "").trim();
            cleanSubject = parts[1].trim();
        }
        if (cleanSubject.includes("— কোড:")) {
            targetCode = cleanSubject.split("— কোড:")[1].trim();
            cleanSubject = cleanSubject.split("— কোড:")[0].replace("বিষয়:", "").trim();
        }

        return { targetClass, targetCode, cleanSubject };
    }

    function loadSavedMarksPreview() {
        const exam = document.getElementById("exam-select").value;
        const subStr = document.getElementById("subject-select").value;
        const section = document.getElementById("section-select").value;

        const { targetClass, cleanSubject } = parseSubjectString(subStr);

        const students = JSON.parse(localStorage.getItem("students") || "[]").filter(s => s.class_name === targetClass && s.section === section);
        const marksStore = JSON.parse(localStorage.getItem("marks_store") || "[]");

        const tbody = document.getElementById("preview-table-body");
        tbody.innerHTML = "";

        if (students.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" class="text-center" style="color: #64748b;">কোনো শিক্ষার্থী পাওয়া যায়নি</td></tr>`;
            return;
        }

        students.forEach(st => {
            const record = marksStore.find(m => m.roll == st.roll && m.exam_type === exam && m.subject_name === cleanSubject && m.section === section && m.class_name === targetClass);
            const val = record ? record.obtained_marks : "এন্ট্রি হয়নি";
            const valStyle = val !== "এন্ট্রি হয়নি" ? "font-weight: bold; color: #0f172a;" : "color: #94a3b8;";

            tbody.innerHTML += `
                <tr>
                    <td class="text-center">${st.roll}</td>
                    <td>${st.name}</td>
                    <td class="text-center" style="${valStyle}">${val}</td>
                </tr>
            `;
        });
    }

    // --- Student Marks Entry ---
    let currentEntryConfig = {};

    function openStudentMarksEntry() {
        const exam = document.getElementById("exam-select").value;
        const subStr = document.getElementById("subject-select").value;
        const section = document.getElementById("section-select").value;

        if (subStr.includes("পাওয়া যায়নি")) {
            alert("দয়া করে সঠিক বিষয় নির্বাচন করুন!");
            return;
        }

        const { targetClass, targetCode, cleanSubject } = parseSubjectString(subStr);
        const configs = JSON.parse(localStorage.getItem("subject_marks_config") || "[]");
        const cfg = configs.find(c => c.class_name === targetClass && c.subject_code === targetCode) || { written_marks: 0, mcq_marks: 0, practical_marks: 0 };

        currentEntryConfig = { exam, subStr, section, targetClass, targetCode, cleanSubject, ...cfg };

        document.getElementById("entry-sub-header").innerText = `পরীক্ষা: ${exam} | ক্লাস: ${targetClass} | শাখা: ${section}`;

        // Dynamic Header Setup
        document.getElementById("col-cq").style.display = cfg.written_marks > 0 ? "" : "none";
        document.getElementById("col-mcq").style.display = cfg.mcq_marks > 0 ? "" : "none";
        document.getElementById("col-prac").style.display = cfg.practical_marks > 0 ? "" : "none";
        document.getElementById("col-single").style.display = (cfg.written_marks === 0 && cfg.mcq_marks === 0 && cfg.practical_marks === 0) ? "" : "none";

        const students = JSON.parse(localStorage.getItem("students") || "[]").filter(s => s.class_name === targetClass && s.section === section);
        const marksStore = JSON.parse(localStorage.getItem("marks_store") || "[]");
        const tbody = document.getElementById("entry-table-body");
        tbody.innerHTML = "";

        students.forEach(st => {
            const record = marksStore.find(m => m.roll == st.roll && m.exam_type === exam && m.subject_name === cleanSubject && m.section === section && m.class_name === targetClass);
            let savedVal = record ? record.obtained_marks : "";

            let wVal = "", mVal = "", pVal = "", isAbs = savedVal === "ABSENT";
            if (!isAbs && savedVal.includes("_")) {
                const parts = savedVal.split("_");
                wVal = parts[0] || "";
                mVal = parts[1] || "";
                pVal = parts[2] || "";
            } else if (!isAbs) {
                wVal = savedVal;
            }

            const disAttr = isAbs ? "disabled" : "";

            tbody.innerHTML += `
                <tr data-roll="${st.roll}">
                    <td class="text-center">${st.roll}</td>
                    <td>${st.name}</td>
                    ${cfg.written_marks > 0 ? `<td class="text-center"><input type="text" class="entry-input in-w" value="${wVal}" ${disAttr}></td>` : ''}
                    ${cfg.mcq_marks > 0 ? `<td class="text-center"><input type="text" class="entry-input in-m" value="${mVal}" ${disAttr}></td>` : ''}
                    ${cfg.practical_marks > 0 ? `<td class="text-center"><input type="text" class="entry-input in-p" value="${pVal}" ${disAttr}></td>` : ''}
                    ${(cfg.written_marks === 0 && cfg.mcq_marks === 0 && cfg.practical_marks === 0) ? `<td class="text-center"><input type="text" class="entry-input in-s" value="${wVal}" ${disAttr}></td>` : ''}
                    <td class="text-center">
                        <input type="checkbox" class="chk-abs" ${isAbs ? 'checked' : ''} onchange="toggleAbsent(this)">
                    </td>
                </tr>
            `;
        });

        showScreen("entry-screen");
    }

    function toggleAbsent(chk) {
        const row = chk.closest("tr");
        const inputs = row.querySelectorAll("input[type='text']");
        inputs.forEach(inp => {
            inp.disabled = chk.checked;
            if (chk.checked) inp.value = "";
        });
    }

    function saveMarksAction() {
        const { exam, section, targetClass, targetCode, cleanSubject, written_marks, mcq_marks, practical_marks } = currentEntryConfig;
        let marksStore = JSON.parse(localStorage.getItem("marks_store") || "[]");

        const rows = document.querySelectorAll("#entry-table-body tr");
        rows.forEach(r => {
            const roll = r.getAttribute("data-roll");
            const isAbs = r.querySelector(".chk-abs").checked;

            let mVal = "";
            if (isAbs) {
                mVal = "ABSENT";
            } else {
                if (written_marks === 0 && mcq_marks === 0 && practical_marks === 0) {
                    mVal = r.querySelector(".in-s") ? r.querySelector(".in-s").value.trim() : "";
                } else {
                    const w = r.querySelector(".in-w") ? r.querySelector(".in-w").value.trim() || "0" : "0";
                    const m = r.querySelector(".in-m") ? r.querySelector(".in-m").value.trim() || "0" : "0";
                    const p = r.querySelector(".in-p") ? r.querySelector(".in-p").value.trim() || "0" : "0";
                    if (r.querySelector(".in-w")?.value || r.querySelector(".in-m")?.value || r.querySelector(".in-p")?.value) {
                        mVal = `${w}_${m}_${p}`;
                    }
                }
            }

            if (mVal) {
                const existingIdx = marksStore.findIndex(m => m.roll == roll && m.exam_type === exam && m.subject_name === cleanSubject && m.section === section && m.class_name === targetClass);
                const recordData = { roll: String(roll), exam_type: exam, subject_name: cleanSubject, subject_code: targetCode, section, class_name: targetClass, obtained_marks: mVal };

                if (existingIdx >= 0) {
                    marksStore[existingIdx] = recordData;
                } else {
                    marksStore.push(recordData);
                }
            }
        });

        localStorage.setItem("marks_store", JSON.stringify(marksStore));
        alert("নম্বর সফলভাবে সংরক্ষিত ও আপডেট করা হয়েছে!");
        createDashboard();
    }

    function deleteMarksAction() {
        if (confirm("আপনি কি এই বিষয়ের সমস্ত নম্বর মুছে ফেলতে চান?")) {
            const { exam, section, targetClass, cleanSubject } = currentEntryConfig;
            let marksStore = JSON.parse(localStorage.getItem("marks_store") || "[]");

            marksStore = marksStore.filter(m => !(m.exam_type === exam && m.subject_name === cleanSubject && m.section === section && m.class_name === targetClass));
            localStorage.setItem("marks_store", JSON.stringify(marksStore));

            alert("নম্বরগুলো সফলভাবে মুছে ফেলা হয়েছে!");
            createDashboard();
        }
    }

    // --- Fast Batch Cloud Sync ---
    async function syncDashboardDataToCloud() {
        const exam = document.getElementById("exam-select").value;
        if (!exam) {
            alert("অনুগ্রহ করে প্রথমে পরীক্ষার নাম সিলেক্ট করুন!");
            return;
        }

        if (!confirm("আপনি কি এই পরীক্ষার সমস্ত সংরক্ষিত ফলাফল দ্রুত অনলাইন গুগল শিটে পাঠাতে চান?")) return;

        const marksStore = JSON.parse(localStorage.getItem("marks_store") || "[]").filter(m => m.exam_type === exam);
        const students = JSON.parse(localStorage.getItem("students") || "[]");

        if (marksStore.length === 0) {
            alert("শিটে পাঠানোর মতো এই পরীক্ষার কোনো সংরক্ষিত ফলাফল পাওয়া যায়নি!");
            return;
        }

        const modal = document.getElementById("progress-modal");
        const pFill = document.getElementById("progress-fill");
        const pText = document.getElementById("progress-text");
        
        modal.style.display = "flex";
        pFill.style.width = "30%";
        pText.innerText = "ডেটা প্রস্তুত করা হচ্ছে...";

        // ব্যাচ পে-লোড তৈরি
        const payloadBatch = marksStore.map(m => {
            const st = students.find(s => String(s.roll) === String(m.roll) && String(s.class_name) === String(m.class_name) && String(s.section) === String(m.section)) || {};

            let written = 0, mcq = 0, prac = 0, totalMarks = 0;
            if (m.obtained_marks === "ABSENT") {
                totalMarks = "ABSENT";
            } else if (String(m.obtained_marks).includes("_")) {
                const parts = m.obtained_marks.split("_");
                written = parseFloat(parts[0]) || 0;
                mcq = parseFloat(parts[1]) || 0;
                prac = parseFloat(parts[2]) || 0;
                totalMarks = written + mcq + prac;
            } else {
                totalMarks = parseFloat(m.obtained_marks) || 0;
            }

            return {
                id: `${m.class_name}_${m.section}_${m.roll}_${m.exam_type}_${m.subject_name}`,
                exam_name: m.exam_type,
                class_name: m.class_name,
                section: m.section,
                department: st.department || "",
                subject_name: m.subject_name,
                subject_code: m.subject_code || "",
                student_id: "",
                roll: m.roll,
                name: st.name || "",
                written: written,
                mcq: mcq,
                practical: prac,
                total: totalMarks
            };
        });

        pFill.style.width = "70%";
        pText.innerText = "গুগল শিটে সার্ভারে পাঠানো হচ্ছে...";

        try {
            await fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payloadBatch)
            });

            pFill.style.width = "100%";
            pText.innerText = "১০০% সম্পন্ন!";

            setTimeout(() => {
                modal.style.display = "none";
                alert(`সফলভাবে মোট ${payloadBatch.length} টি ফলাফল অনলাইন গুগল শিটে আপডেট করা হয়েছে!`);
            }, 500);

        } catch (err) {
            console.error("Sync error:", err);
            modal.style.display = "none";
            alert("গুগল শিটে ডেটা পাঠাতে সমস্যা হয়েছে। ইন্টারনেট কানেকশন যাচাই করুন!");
        }
    }
</script>
